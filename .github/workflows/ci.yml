# Tests every pull request and every push to main. On main, releases the version in package.json when it has no tag yet: to npm, then as a tag
# and a GitHub release with notes from the pull requests merged since the last one. npm takes a publish only from this file, ci.yml, in the
# environment npm: renaming either stops releases (docs/user_guides/develop_agentx.md).

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm test

  # The tag of package.json's version, when it is not out yet.
  version:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: tag
        run: |
          tag="v$(jq -r .version package.json)"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "$tag is out already."
          else
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: [test, version]
    if: needs.version.outputs.tag
    runs-on: ubuntu-latest
    # The environment deploys only from main, and npm's trusted publisher names it.
    environment: npm
    # One release at a time, never cancelled: a cancelled one could stop between npm and the tag.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write # the tag and the release
      id-token: write # npm's trusted publishing, which needs no token
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the earlier tags, where the notes start
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # A run that failed after publishing can run again: npm never takes a version twice.
      - name: Publish to npm
        run: |
          name="$(jq -r .name package.json)@${TAG#v}"
          if [ "$(npm view "$name" version 2> /dev/null)" = "${TAG#v}" ]; then echo "$name is on npm already."; else npm publish; fi
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes --notes-start-tag "$(git describe --tags --abbrev=0 --match 'v*')"
